name: CI - AML Policy Guardian Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Build & Unit Tests
  # ---------------------------------------------------------------------------
  backend-unit-tests:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit Tests
        working-directory: ./backend
        run: |
          ./mvnw clean test \
            -Dtest="*UnitTest,*Test" \
            -Dspring.profiles.active=test \
            -B

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Integration Tests with pgvector
  # ---------------------------------------------------------------------------
  backend-integration-tests:
    name: Backend Integration Tests (pgvector)
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aml_assistant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aml_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Integration Tests
        working-directory: ./backend
        run: |
          ./mvnw test \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/aml_assistant \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=postgres \
            -Dapp.jwt.secret=${{ secrets.JWT_SECRET || '4c8b21e8e561a37c02b9e6584dc74c207b822d56a282f1b402179836371ad5f3e9c704a43b2f515e1bc09a656711c1e550b06b9b3e02' }} \
            -B

  # ---------------------------------------------------------------------------
  # 3. Frontend Build & Tests
  # ---------------------------------------------------------------------------
  frontend-build-and-test:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular Frontend (Production Configuration)
        working-directory: ./frontend
        run: npm run build -- --configuration production

  # ---------------------------------------------------------------------------
  # 4. Security & Dependency Vulnerability Scanning
  # ---------------------------------------------------------------------------
  security-checks:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Secret Leaks (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Frontend Dependency Vulnerability Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ---------------------------------------------------------------------------
  # 5. Docker Image Build Verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-build-and-test, security-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aml-assistant-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aml-assistant-frontend:ci
