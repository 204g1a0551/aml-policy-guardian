apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aml-ingress
  namespace: aml-guardian
  labels:
    app.kubernetes.io/name: aml-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aml-guardian.bank.internal
      secretName: aml-guardian-tls
  rules:
    - host: aml-guardian.bank.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aml-backend
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: aml-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aml-frontend
                port:
                  number: 80
