spring:
  application:
    name: aml-assistant-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/aml_assistant}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.openai.com}
      api-key: ${LLM_API_KEY:mock-key}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.0
      embedding:
        base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:https://api.openai.com}}
        api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:mock-key}}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-ada-002}
    vectorstore:
      pgvector:
        initialize-schema: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:4c8b21e8e561a37c02b9e6584dc74c207b822d56a282f1b402179836371ad5f3e9c704a43b2f515e1bc09a656711c1e550b06b9b3e02}
    expiration-ms: 3600000
