apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aml-backend-pdb
  namespace: aml-guardian
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aml-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aml-frontend-pdb
  namespace: aml-guardian
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aml-frontend
