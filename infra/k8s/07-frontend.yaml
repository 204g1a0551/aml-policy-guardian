apiVersion: v1
kind: Service
metadata:
  name: aml-frontend
  namespace: aml-guardian
  labels:
    app.kubernetes.io/name: aml-frontend
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: aml-frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-frontend
  namespace: aml-guardian
  labels:
    app.kubernetes.io/name: aml-frontend
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aml-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aml-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: 204g1a0551/aml-assistant-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
